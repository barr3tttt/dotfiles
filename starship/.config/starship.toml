"$schema" = 'https://starship.rs/config-schema.json'

# Dracula (official palette) - matches the mac host and wezterm/tmux/ble.sh.
# Same layout as mac/.config/starship.toml plus the Ship's kubernetes and
# exit-status modules. Root-level keys stay ABOVE the first [section] header
# (see AGENTS.md lesson 2026-07-24).

palette = "dracula"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$cmd_duration\
$status\
$character"""

[palettes.dracula]
background  = "#282a36"
foreground  = "#f8f8f2"
selection   = "#44475a"
comment     = "#6272a4"
cyan        = "#8be9fd"
green       = "#50fa7b"
orange      = "#ffb86c"
pink        = "#ff79c6"
purple      = "#bd93f9"
red         = "#ff5555"
yellow      = "#f1fa8c"

# Color language mirrors WezTerm/tmux:
#   purple  = primary accent (dir, active tab)
#   pink    = current/branch
#   cyan    = tooling/prompt char
#   yellow  = attention/secondary (git status)
#   comment = dim meta

[directory]
style = "bold purple"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "pink"
format = '[$symbol $branch ]($style)'

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "cyan"
format = '[$symbol $version ]($style)'

[python]
symbol = ""
style = "cyan"
format = '[$symbol $version ]($style)'

[rust]
symbol = ""
style = "cyan"
format = '[$symbol $version ]($style)'

[golang]
symbol = ""
style = "cyan"
format = '[$symbol $version ]($style)'

[docker_context]
symbol = ""
style = "cyan"
format = '[$symbol $context ]($style)'

[kubernetes]
disabled = false
format = '[⎈ $context(/$namespace) ]($style)'
style = "cyan"
detect_env_vars = ['KUBECONFIG']

[cmd_duration]
min_time = 500
style = "comment"
format = '[ $duration ]($style)'

[status]
disabled = false
format = '[✗ $status ]($style)'
style = "red"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"
